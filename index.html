<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대전고교 업무 ESC 챗봇</title>
<meta name="description" content="대전광역시 고등학교 교무업무 근거 자료 기반 질의응답 챗봇">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===== 설정: 아래 주소를 내 Supabase 함수 주소로 바꾸세요 (script 맨 위 API 상수) ===== */
:root{
  --bg:#f6f7fb; --panel:#ffffff; --ink:#1b2333; --muted:#5d6779; --line:#e3e7ef;
  --brand:#1f3a68; --brand-2:#2f5bb7; --brand-soft:#e9effb; --user:#1f3a68; --user-ink:#fff;
  --warn:#9a5b00; --warn-soft:#fff4dc; --cite:#2f5bb7; --solid:#1f3a68; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f141c; --panel:#171e29; --ink:#e6eaf2; --muted:#9aa5b8; --line:#273142;
    --brand:#8fb0f0; --brand-2:#9fbdf5; --brand-soft:#1d2a40; --user:#2b4f93; --user-ink:#fff;
    --warn:#f2c36b; --warn-soft:#2c2414; --cite:#9fbdf5; --solid:#3a66c4; --shadow:none; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15.5px;line-height:1.65;-webkit-text-size-adjust:100%}
.app{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--solid);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:16.5px;letter-spacing:-.01em}
.ttl span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-ghost{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
.btn-ghost:hover{border-color:var(--brand-2)}
main{flex:1;padding:18px 16px 8px}
.welcome{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.welcome h2{margin:0 0 6px;font-size:17px}
.welcome p{margin:0 0 12px;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--brand-soft);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--brand-2)}
.msg{margin:16px 0;display:flex}
.msg.user{justify-content:flex-end}
.bubble{max-width:100%;border-radius:16px;padding:12px 15px;overflow-wrap:anywhere}
.user .bubble{background:var(--user);color:var(--user-ink);max-width:85%;border-bottom-right-radius:6px;white-space:pre-wrap}
.bot .bubble{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);width:100%;border-bottom-left-radius:6px}
.bot .bubble p{margin:.35em 0}
.bot .bubble ul,.bot .bubble ol{margin:.35em 0;padding-left:1.35em}
.bot .bubble li{margin:.15em 0}
.bot .bubble h4{margin:.7em 0 .2em;font-size:15.5px}
.bot .bubble a{color:var(--brand-2)}
.tbl{overflow-x:auto;margin:.5em 0}
.tbl table{border-collapse:collapse;font-size:14px;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.tbl th{background:var(--brand-soft)}
.typing{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:13.5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.model{font-size:12px;color:var(--muted);margin-top:8px}
.fb{display:flex;gap:6px;margin-top:10px;align-items:center;color:var(--muted);font-size:12.5px}
.fb button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:3px 9px;font:inherit;font-size:12.5px;cursor:pointer}
.fb button.on{border-color:var(--brand-2);color:var(--brand-2);background:var(--brand-soft)}
.err{color:#b3261e}
footer{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
.composer:focus-within{border-color:var(--brand-2)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;max-height:160px;min-height:24px;padding:6px 0}
.send{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:var(--solid);color:#fff;display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.45;cursor:default}
.send svg{width:18px;height:18px}
.note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:7px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:18px;max-width:340px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog input{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);margin:8px 0 12px}
.row{display:flex;gap:8px;justify-content:flex-end}
.btn{border:0;background:var(--solid);color:#fff;border-radius:9px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
@media (max-width:520px){ body{font-size:15px} main{padding:14px 12px 6px} footer{padding-left:12px;padding-right:12px} .ttl span{font-size:12px} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg>
    </div>
    <div class="ttl"><b>대전고교 업무 ESC 챗봇</b><span>법령·지침·기재요령 등 등록된 근거 자료로 답합니다</span></div>
    <button class="btn-ghost" id="newChat" type="button">새 대화</button>
  </header>

  <main id="list">
    <section class="welcome" id="welcome">
      <h2>무엇을 도와드릴까요?</h2>
      <p>학년도·학년(입학연도)을 함께 적으면 더 정확합니다. 학생 이름 같은 개인정보는 빼고 질문해 주세요.</p>
      <div class="chips" id="chips"></div>
    </section>
  </main>

  <footer>
    <form class="composer" id="form">
      <textarea id="q" rows="1" placeholder="업무 질문을 입력하세요" aria-label="질문 입력"></textarea>
      <button class="send" id="send" type="submit" aria-label="보내기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="note">답변은 업무 참고용입니다. 결론에 쓰기 전 관련 규정 원문을 확인해 주세요.</div>
  </footer>
</div>

<dialog id="codeDlg">
  <form method="dialog" id="codeForm">
    <b>접속 코드</b>
    <div style="font-size:13px;color:var(--muted);margin-top:4px">카카오톡 채널에서 안내받은 접속 코드를 입력해 주세요.</div>
    <input id="codeIn" autocomplete="off" inputmode="text">
    <div class="row"><button class="btn" value="ok">확인</button></div>
  </form>
</dialog>

<script>
/* ===== 설정 ===== */
const API = "https://nzsgvjdotnvqpzhehfsg.supabase.co/functions/v1/hs-chatbot";   // 챗봇 함수 주소
const EXAMPLES = [
  "2026학년도 2학년 동아리 연계 봉사활동 실적 인정 기준은?",
  "질병결석이 4일 연속이면 출결 특기사항에 입력하나요?",
  "2022 개정 교육과정 학점 이수 인정 기준을 알려줘",
  "교과 세특에 대학명이나 기관명을 쓸 수 있나요?",
  "학교폭력 조치사항 기재와 삭제 절차는?",
  "우리 학교 교육과정 편성표는 어디서 보나요?"
];

// 주소 끝에 ?model=gemini 또는 ?model=claude 를 붙이면 그 모델로 답합니다(비교용).
const PROVIDER = (new URLSearchParams(location.search).get("model")||"").toLowerCase();

const $ = s => document.querySelector(s);
const list = $("#list"), q = $("#q"), sendBtn = $("#send");
let history = [];          // [{q,a}]
let busy = false;
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };

EXAMPLES.forEach(t => { const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=t; b.onclick=()=>ask(t); $("#chips").appendChild(b); });
q.addEventListener("input", grow); function grow(){ q.style.height="auto"; q.style.height=Math.min(q.scrollHeight,160)+"px"; }
q.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("#form").requestSubmit(); } });
$("#form").addEventListener("submit", e => { e.preventDefault(); const t=q.value.trim(); if(t) ask(t); });
$("#newChat").onclick = () => { history=[]; list.querySelectorAll(".msg").forEach(n=>n.remove()); $("#welcome").style.display=""; q.focus(); };

/* ----- 간단한 마크다운 표시 ----- */
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inline(s){
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s;
}
function md(text){
  const lines = text.replace(/\r/g,"").split("\n"); let out=[], i=0;
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      const row = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
      const head=row(l); i+=2; const body=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
      out.push('<div class="tbl"><table><thead><tr>'+head.map(h=>"<th>"+h+"</th>").join("")+"</tr></thead><tbody>"+
        body.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>"); continue;
    }
    if(/^\s*(\d+)[.)]\s+/.test(l)){ const items=[]; while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*\d+[.)]\s+/,""));
      out.push("<ol>"+items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ol>"); continue; }
    if(/^\s*[-•·*]\s+/.test(l)){ const items=[]; while(i<lines.length && /^\s*[-•·*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-•·*]\s+/,""));
      out.push("<ul>"+items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>"); continue; }
    if(/^\s*#{1,6}\s+/.test(l)){ out.push("<h4>"+inline(l.replace(/^\s*#{1,6}\s+/,""))+"</h4>"); i++; continue; }
    if(!l.trim()){ i++; continue; }
    const para=[]; while(i<lines.length && lines[i].trim() && !/^\s*(\||\d+[.)]\s|[-•·*]\s|#{1,6}\s)/.test(lines[i])) para.push(lines[i++]);
    if(para.length) out.push("<p>"+para.map(inline).join("<br>")+"</p>"); else { out.push("<p>"+inline(l)+"</p>"); i++; }
  }
  return out.join("");
}

function addMsg(role, html){
  $("#welcome").style.display="none";
  const m=document.createElement("div"); m.className="msg "+role;
  const b=document.createElement("div"); b.className="bubble"; if(role==="user") b.textContent=html; else b.innerHTML=html;
  m.appendChild(b); list.appendChild(m); m.scrollIntoView({block:"end",behavior:"smooth"}); return b;
}
// 근거 번호 [1] [2][3] 은 화면에 보이지 않게 지운다(쓰는 중이면 끝에 걸린 "[1" 조각도 지움)
const CITE=/[ \t]*\[\d{1,2}(?:\s*[,~\-–]\s*\d{1,2})*\](?:[ \t]*\[\d{1,2}(?:\s*[,~\-–]\s*\d{1,2})*\])*/g;
function noCite(t, live){ t=t.replace(CITE,""); return live ? t.replace(/[ \t]*\[[\d,~\-– ]{0,6}$/,"") : t; }
function addFeedback(box, logId){
  if(!logId) return;
  const f=document.createElement("div"); f.className="fb";
  f.innerHTML='답변이 도움이 되었나요? <button type="button" data-v="1">도움됨</button><button type="button" data-v="-1">아쉬움</button>';
  f.querySelectorAll("button").forEach(btn => btn.onclick = async () => {
    f.querySelectorAll("button").forEach(x=>x.classList.remove("on")); btn.classList.add("on");
    try{ await fetch(API.replace(/\/$/,"")+"/feedback",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({log_id:logId,value:+btn.dataset.v})}); }catch(e){}
  });
  box.appendChild(f);
}
function askCode(){
  return new Promise(res => { const d=$("#codeDlg"); $("#codeIn").value=""; d.showModal(); d.onclose=()=>{ const v=$("#codeIn").value.trim(); if(v) store.set("esc_code",v); res(v); }; });
}

async function ask(text){
  if(busy) return; busy=true; sendBtn.disabled=true; q.value=""; grow();
  addMsg("user", text);
  const typing = t => '<span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span>&nbsp;'+esc(t)+'</span>';
  let answer="", sources=[], logId=null, fin=null, status="근거 자료를 찾고 있어요";
  const box = addMsg("bot", typing(status));
  const paint = () => { box.innerHTML = answer ? md(noCite(answer,true)) : typing(status); };
  try{
    for(let attempt=0; attempt<2; attempt++){
      const r = await fetch(API, { method:"POST", headers:{ "content-type":"application/json", "x-access-code": store.get("esc_code")||"" },
        body: JSON.stringify({ question:text, history, ...(PROVIDER?{provider:PROVIDER}:{}) }) });
      if(r.status===401){ const j=await r.json().catch(()=>({})); if(j.need_code && attempt===0 && await askCode()) continue; throw new Error(j.error||"접속 코드가 필요합니다."); }
      if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error||("오류 "+r.status)); }
      const reader=r.body.getReader(), dec=new TextDecoder(); let buf="";
      while(true){
        const {value,done}=await reader.read(); if(done) break;
        buf+=dec.decode(value,{stream:true}); let k;
        while((k=buf.indexOf("\n\n"))>=0){
          const blk=buf.slice(0,k); buf=buf.slice(k+2);
          const ev=(blk.match(/^event: (.*)$/m)||[])[1]; const dl=(blk.match(/^data: (.*)$/m)||[])[1]; if(!dl) continue;
          const data=JSON.parse(dl);
          if(ev==="sources") sources=data;
          else if(ev==="status"){ status=data.text; if(!answer) paint(); }
          else if(ev==="reset"){ answer=""; paint(); }          // 더 찾아보기로 해서 쓰던 글을 지움
          else if(ev==="delta"){ answer+=data.t; paint(); }
          else if(ev==="error") throw new Error(data.message);
          else if(ev==="done"){ fin=data; logId=data.log_id; }
        }
      }
      break;
    }
    if(!answer) answer="답변을 만들지 못했어요. 질문을 조금 더 구체적으로 적어 주세요.";
    box.innerHTML=md(noCite(answer));
    if(PROVIDER&&fin&&fin.model) box.insertAdjacentHTML("beforeend",`<div class="model">답변 모델: ${esc(fin.model)}</div>`);
    addFeedback(box, logId);
    history.push({q:text, a:answer}); if(history.length>3) history=history.slice(-3);
  }catch(e){
    box.innerHTML = (answer?md(noCite(answer)):"") + `<p class="err">${esc(String(e.message||e))}</p>`;
  }finally{
    busy=false; sendBtn.disabled=false; box.parentElement.scrollIntoView({block:"end",behavior:"smooth"}); q.focus();
  }
}
const pre=new URLSearchParams(location.search).get("q"); if(pre) ask(pre);
</script>
</body>
</html>
